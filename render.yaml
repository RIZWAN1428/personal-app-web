# Render Blueprint — defines the web service. The database itself lives
# on Neon (a separate, permanent-free Postgres host — see SETUP_MANUAL.md
# Part 5 for why), so it isn't defined here; you paste its connection
# string in as an environment variable after the first deploy (Part 5,
# step 7 below).
#
# Push this repo to GitHub, then on Render: New -> Blueprint -> pick this
# repo. Render reads this file and creates the web service automatically.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: personalapp-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"
