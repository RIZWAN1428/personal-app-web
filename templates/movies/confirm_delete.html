{% extends "base.html" %}
{% block title %}Delete {{ object.title }} — Personal App{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0 bg-body-tertiary rounded-4 p-4 text-center">
      <i class="bi bi-exclamation-triangle-fill text-danger display-4 mb-3"></i>
      <h3 class="fw-bold mb-2">Delete Movie / TV Show?</h3>
      <p class="text-muted mb-4">
        Are you sure you want to remove <strong>"{{ object.title }}"</strong> from your collection? This action cannot be undone.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'movies:detail' object.pk %}" class="btn btn-light px-4 rounded-pill">Cancel</a>
          <button type="submit" class="btn btn-danger px-4 rounded-pill">Yes, Remove</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
