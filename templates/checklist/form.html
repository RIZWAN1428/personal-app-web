{% extends "base.html" %}
{% block title %}New checklist item — Personal App{% endblock %}
{% block content %}
  <h1 class="mb-4">New checklist item</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="{{ form.text.id_for_label }}">Task</label>
      {{ form.text|safe }}
    </div>
    <div class="mb-3">
      <label class="form-label" for="{{ form.due_date.id_for_label }}">Due date (optional)</label>
      {{ form.due_date|safe }}
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'checklist:list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
{% endblock %}
