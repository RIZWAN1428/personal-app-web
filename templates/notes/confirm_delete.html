{% extends "base.html" %}
{% block title %}Delete note — Personal App{% endblock %}
{% block content %}
  <h1 class="mb-4">Delete note?</h1>
  <p>Are you sure you want to delete "<strong>{{ object.title }}</strong>"? This can't be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'notes:list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
{% endblock %}
