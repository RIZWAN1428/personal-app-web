{% extends "base.html" %}
{% block title %}Log in — Personal App{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="mb-4">Log in</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Email</label>
        {{ form.username|safe }}
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password|safe }}
      </div>
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3">No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
