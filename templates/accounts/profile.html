{% extends "base.html" %}
{% block title %}Profile — Personal App{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="mb-4">Your profile</h1>
    <p class="text-muted">{{ request.user.email }}</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.display_name.id_for_label }}">Display name</label>
        {{ form.display_name|safe }}
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.theme_preference.id_for_label }}">Theme</label>
        {{ form.theme_preference|safe }}
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
